# Builds the distribution and publishes it to PyPI when a GitHub release is
#  published. Authenticates through PyPI trusted publishing (OIDC), so no token
#  is stored anywhere: the project on PyPI has to list this repository,
#  this workflow file name and the `pypi` environment as a trusted publisher.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag must name the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} but pyproject.toml says $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
