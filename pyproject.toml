[build-system]
requires      = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entarchy"
version = "0.1"
description = ""
readme = "README.md"
authors = [{ name = 'Tim Hladnik', email = "contact@vxpy.org" }]
license = { file = 'LICENSE' }
classifiers = [
        'Development Status :: 3 - Alpha',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
        'Operating System :: POSIX :: Linux',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: Microsoft :: Windows :: Windows 11',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Topic :: Scientific/Engineering',
        'Topic :: Data Analysis'
]
keywords = ['neuroscience', 'data analysis']
dependencies = [
    'alive-progress',
    'numpy',
    'pandas',
    'pyyaml',
    'SQLAlchemy',  # for now, but will be moved to optional dependencies in the future
    'PyMySQL',     # for now, but will be moved to optional dependencies in the future
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ['.']
include = ['entarchy*']

[project.optional-dependencies]
mysql = [
    'SQLAlchemy',
    'PyMySQL',
]
# Needed to run map_async on functions defined in a notebook cell, which worker
#  processes cannot import
notebook = ['cloudpickle']
# Needed to write and read ASDF archives (entarchy.tools.archive)
asdf = ['asdf']
dev = ['pip-tools', 'pytest', 'build', 'twine',
       'cloudpickle', 'nbformat', 'nbclient', 'ipykernel', 'asdf']

[project.urls]
Homepage = 'https://github.com/thladnik/entarchy'

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['slow: tests that spawn subprocess workers']
