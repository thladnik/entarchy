[build-system]
# 77 is the first setuptools that reads the SPDX `license` string below
requires      = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entarchy"
version = "0.2.0"
description = "Hierarchical entity data manager for analysis prototyping, on SQLite or MySQL"
readme = "README.md"
authors = [{ name = 'Tim Hladnik', email = "contact@vxpy.org" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
        'Development Status :: 3 - Alpha',
        'Intended Audience :: Science/Research',
        'Operating System :: POSIX :: Linux',
        'Operating System :: Microsoft :: Windows',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Topic :: Scientific/Engineering',
        'Topic :: Scientific/Engineering :: Information Analysis',
        'Topic :: Database',
        'Typing :: Typed',
]
keywords = ['neuroscience', 'data analysis', 'entity-attribute-value', 'sqlite', 'mysql']
dependencies = [
    'alive-progress',
    'numpy',
    'pandas',
    'pyyaml',
    # Both backends are built on SQLAlchemy, and the MySQL one needs a driver.
    #  Neither belongs behind an extra: an entarchy names its backend class in
    #  entarchy.yaml and instantiates it on open, so a store written against a
    #  server has to be openable by whoever is handed it, whatever they chose
    #  for their own
    'SQLAlchemy',
    'PyMySQL',
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ['.']
include = ['entarchy*']

# PEP 561: without this marker a type checker treats an installed entarchy as
#  untyped and offers nothing from it, however well annotated the source is
[tool.setuptools.package-data]
entarchy = ['py.typed']

[project.optional-dependencies]
# Needed to run map_async on functions defined in a notebook cell, which worker
#  processes cannot import
notebook = ['cloudpickle']
# Needed to write and read ASDF archives (entarchy.tools.archive)
asdf = ['asdf']
dev = ['pip-tools', 'pytest', 'build', 'twine',
       'cloudpickle', 'nbformat', 'nbclient', 'ipykernel', 'asdf',
       # map_async caps each worker's BLAS threads through the environment; with
       #  this installed it also caps a BLAS the worker had already loaded
       'threadpoolctl',
       # tests/test_typing.py asks it what an editor would infer; the suite
       #  skips those tests where it is not installed
       'pyright']

[project.urls]
Homepage = 'https://github.com/thladnik/entarchy'
Repository = 'https://github.com/thladnik/entarchy'
Issues = 'https://github.com/thladnik/entarchy/issues'

[tool.pytest.ini_options]
testpaths = ['tests']
markers = ['slow: tests that spawn subprocess workers or build large collections']
